<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101916"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>Road to 2:30</title></head><body><main><header><small>HALF MARATHON / 8 WEEKS</small><h1>Road to 2:30</h1><p>One run at a time.</p></header><p id="status" role="status"></p><section id="auth"><h2>Sign in</h2><form id="login"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><button>Sign in</button><button type="button" id="signup" class="secondary">Create account</button></form></section><div id="app" hidden><nav><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="history">History</button><button data-tab="settings">Settings</button></nav><section id="today"><div class="stats" id="stats"></div><h2>Daily training</h2><label>Training date<input type="date" id="day"></label><div id="workout"></div><form id="record" hidden><div id="runFields"><label>Distance (km)<input id="distance" type="number" min="0.01" max="100" step="0.01" inputmode="decimal"></label><div class="times"><label>Hours<input id="hours" type="number" min="0" max="23" step="1" value="0"></label><label>Minutes<input id="minutes" type="number" min="0" max="59" step="1" value="0"></label><label>Seconds<input id="seconds" type="number" min="0" max="59" step="1" value="0"></label></div><p id="pace"></p></div><button id="save">Complete & save</button></form><button id="remove" class="secondary" hidden>Delete record</button></section><section id="plan" hidden><h2>8-week plan</h2><div class="scroll"><table id="table"></table></div><div id="guide"></div></section><section id="history" hidden><h2>Training history</h2><button id="export" class="secondary">Export CSV</button><div id="records"></div></section><section id="settings" hidden><h2>Settings</h2><p id="account"></p><form id="settingsForm"><label>Week 1 Monday<input type="date" id="start" required></label><p>Race day is Saturday of week 8.</p><button>Save start date</button></form><button id="logout" class="secondary">Sign out</button></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="plan.js"></script><script src="app.js"></script></body></html>
